name: Test Branch

on:
  pull_request:
  merge_group:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # https://github.com/actions/checkout/releases
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # https://github.com/jdx/mise-action/releases
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      # https://github.com/actions/setup-go/releases
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          check-latest: true
          go-version-file: go.mod

      - name: Setup golangci-lint cache
        # https://github.com/actions/cache/releases
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: ${{ runner.os }}-golangci-lint-${{ hashFiles('**/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-golangci-lint-

      - name: Run tidy
        run: make tidy && git diff --exit-code

      - name: Run audit
        run: make audit

      - name: Run lint
        run: make lint

      - name: Run test
        run: make test

      - name: Generate schema
        run: make schema & git diff --exit-code

      # https://github.com/codecov/codecov-action/releases
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: success() && github.ref == 'refs/heads/main'
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
