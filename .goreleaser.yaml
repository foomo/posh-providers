# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: posh-providers

release:
  prerelease: auto

builds:
  - skip: true

archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files: [ LICENSE, README.md ]

checksum:
  name_template: checksums.txt

changelog:
  use: github-native
